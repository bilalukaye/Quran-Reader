<style>
@font-face{font-family:"IndoPak Nastaleeq";src:url(/fonts/indopak.woff2?v=6b705760e4) format("woff2");font-display:block}
:root{
  --paper:#F7F3EA; --surface:#F7F3EA; --sunk:#EDE6D7; --ink:#1F1C17; --muted:#68625A;
  --pri:#1F5C48; --pri-soft:#E3EBE2; --gold:#98712A; --gold-soft:#EFE4C8; --teal:#3B7759;
  --line:#E2D9C7; --danger:#A3352B; --on-pri:#FBF8F1;
  --q:"Amiri Quran","Amiri","Scheherazade New","Noto Naskh Arabic","Traditional Arabic",serif;
  --ar:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif;
  --lat:"Literata",Georgia,"Times New Roman",serif;
  --qsize:34px; --tsize:17px; --lhk:1; --navh:56px; --lhpx:75px; --qstroke:.04em;
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --rule:color-mix(in srgb,var(--ink) 30%,transparent);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:var(--sal);padding-right:var(--sar);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]):not([data-theme="paper"]){
    --paper:#121714; --surface:#121714; --sunk:#1B241F; --ink:#E4DED0; --muted:#A09E95;
    --pri:#8FCBAE; --pri-soft:#1E3529; --gold:#D4AF62; --gold-soft:#3A321F; --teal:#7CC09D;
    --line:#28392F; --danger:#E88A80; --on-pri:#0F1714; color-scheme:dark;
  }
}
:root[data-theme="paper"]{
  --paper:#F1E7D0; --surface:#F1E7D0; --sunk:#E9DDC2; --ink:#2B2416; --muted:#665C47;
  --pri:#25543D; --pri-soft:#E4E2C9; --gold:#8E631B; --gold-soft:#ECDDB6; --teal:#386D50; --line:#D9CBA9; --on-pri:#F9F2E2; color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#121714; --surface:#121714; --sunk:#1B241F; --ink:#E4DED0; --muted:#A09E95;
  --pri:#8FCBAE; --pri-soft:#1E3529; --gold:#D4AF62; --gold-soft:#3A321F; --teal:#7CC09D;
  --line:#28392F; --danger:#E88A80; --on-pri:#0F1714; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--lat);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
a{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hidden{display:none!important}

/* top bar */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:6px 8px;min-height:52px}
.ib{border:0;background:transparent;min-width:44px;height:44px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--pri);padding:0 8px;font-size:15px}
.ib:hover{background:var(--sunk)}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top .title{flex:1;min-width:0;text-align:center;border:0;background:transparent;padding:4px 6px;border-radius:10px}
.top .title b{display:block;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .title small{display:block;color:var(--muted);font-size:12px}
.zoom{font-weight:600}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:var(--sal);padding-right:var(--sar)}
nav.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:12px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--pri);font-weight:600}
main{padding-bottom:calc(var(--navh) + 24px + env(safe-area-inset-bottom,0px))}
body.has-player main{padding-bottom:calc(var(--navh) + 88px + env(safe-area-inset-bottom,0px))}
.boot{max-width:420px;margin:22vh auto 0;text-align:center;color:var(--muted);padding:0 20px}
.boot .bmark{font-family:var(--ar);font-size:34px;color:var(--pri);margin-bottom:10px}
.boot .bbar{height:3px;background:var(--sunk);border-radius:3px;overflow:hidden;margin:16px auto 0;width:160px}
.boot .bbar i{display:block;height:100%;width:40%;background:var(--gold);animation:bslide 1.1s ease-in-out infinite}
@keyframes bslide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){.boot .bbar i{animation:none;width:100%}}
/* recitation player */
.player{position:fixed;left:0;right:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px));z-index:19;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;gap:0;padding:4px calc(4px + var(--sar)) 4px calc(14px + var(--sal));min-height:60px;box-shadow:0 -4px 14px rgba(0,0,0,.05)}
body.focus .player{bottom:env(safe-area-inset-bottom,0px)}
.player .pinfo{flex:1;min-width:0;text-align:left;border:0;background:none;padding:6px 6px 6px 0;min-height:44px}
.player .pinfo b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .pinfo small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player.err .pinfo small{color:var(--danger);white-space:normal}
.player .pp{width:48px;height:48px;border-radius:50%;background:var(--pri);color:var(--on-pri);margin:0 2px}
.player .pp:hover{background:var(--pri)}
.player .pp svg{fill:currentColor;stroke:none}
.spin{display:inline-block;width:20px;height:20px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
/* ---------- mushaf look: ruled lines + page mode ---------- */
.mushaf.ruled{text-align:justify;text-align-last:right;background-image:linear-gradient(to bottom,transparent calc(var(--lhpx) - 1px),var(--rule) calc(var(--lhpx) - 1px));background-size:100% var(--lhpx);background-repeat:repeat-y}
.mushaf.ruled .jz,.mushaf.ruled .pend,.pager .mushaf .jz,.pager .mushaf .pend{display:inline-flex;width:100%;height:var(--lhpx);margin:0;line-height:1.3;vertical-align:top;text-align-last:auto}
.pager .mushaf,.mushaf.ruled{widows:1;orphans:1}
/* Every printed line is exactly one ruled line tall: letters and marks inside it can never stretch a line. */
.mushaf.ruled .ay,.mushaf.ruled .ay .w,.mushaf.ruled .ay .rk,.mushaf.ruled .ay .sj,.mushaf.ruled .ay .an.ip,.pager .mushaf .ay,.pager .mushaf .ay .w,.pager .mushaf .ay .rk,.pager .mushaf .ay .sj,.pager .mushaf .ay .an.ip{line-height:0}
.reader.snap .cartouche,.reader.snap .listen,.reader.snap .bism,.reader.snap .endnav{margin-top:0;margin-bottom:0;box-sizing:border-box}
.reader.snap .listen,.reader.snap .endnav{display:flex;align-items:center;justify-content:center}
body.paged{overscroll-behavior-x:none}
.pager{position:relative;overflow:hidden;margin:0 6px;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.pager .reader{max-width:none;margin:0;padding:0 14px;direction:rtl;column-fill:auto;will-change:transform}
.pager .mushaf{text-align:justify;text-align-last:right;background:none}
@media (max-width:599px){.pager .mushaf{text-align:right}} /* few words per line on phones: avoid stretched gaps */
.pager .cartouche,.pager .listen,.pager .endnav,.pager .ayblock,.pager .jz,.pager .pend{direction:ltr}
.pager .mushaf .jz,.pager .mushaf .pend{direction:ltr}
.pager .cartouche{max-width:none}
.pager .ay.flash{animation:none;background:var(--gold-soft)}
.phead{display:flex;justify-content:space-between;align-items:baseline;margin:0 20px;padding:6px 0 2px;direction:rtl;color:var(--gold);line-height:1.2}
.phead .ps{font-family:var(--q);font-size:19px}
.phead .pj{font-family:var(--ar);font-size:16px;color:var(--muted)}
.pnum{text-align:center;font-size:15px;color:var(--muted);padding:2px 0 4px;line-height:1.3;font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sr-only button:focus{position:fixed;left:12px;bottom:calc(var(--navh) + 12px);width:auto;height:auto;clip:auto;z-index:30}
body.paged .top .title small{display:none}
body.paged header.top{border-bottom-color:transparent}
.ay.playing{background:color-mix(in srgb,var(--gold) 15%,transparent);border-radius:8px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.listen{display:flex;justify-content:center;margin:2px 0 6px}
.listen .btn{display:inline-flex;align-items:center;gap:8px}
.listen svg{width:16px;height:16px;fill:currentColor}
.rk{font-family:var(--q);color:var(--gold);font-size:.62em;margin:0 .12em;line-height:0;position:relative;top:-.35em;vertical-align:baseline}
.wdb{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:2px 0 10px;text-align:center}
.wdb div{min-width:0}
.wdb b{display:block;font-size:20px;font-weight:600;color:var(--ink)}
.wdb span{font-size:13px;color:var(--muted)}
.sublabel{font-size:12px;letter-spacing:.02em;color:var(--muted);margin:14px 0 4px}
.qsep{border:0;border-top:1px solid var(--line);margin:12px 0}
.more .li{min-height:56px}
.more .li svg{width:22px;height:22px;stroke:var(--pri);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.prose p{margin:0 0 12px;line-height:1.6}
.prose h2{margin-top:22px}
.prose a{color:var(--pri)}
.act.lnk{text-decoration:none;color:inherit}
body.focus header.top, body.focus nav.tabs{display:none}
body.focus main{padding-bottom:40px}
#exitFocus{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;border:1px solid var(--line);background:var(--surface);color:var(--pri);border-radius:999px;padding:8px 14px;box-shadow:0 2px 8px rgba(0,0,0,.15)}

/* banners */
.banners{max-width:920px;margin:0 auto;padding:10px 14px 0;display:grid;gap:8px}
.banner{display:flex;gap:10px;align-items:center;background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-radius:12px;padding:10px 12px;font-size:14px}
.banner b{font-weight:600}
.banner .grow{flex:1}
.btn{border:1px solid var(--pri);background:var(--pri);color:var(--on-pri);min-height:44px;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--pri)}
.btn.small{padding:6px 10px;font-size:13px}

/* reader */
.reader{max-width:920px;margin:0 auto;padding:6px 16px 20px}
.cartouche{margin:14px auto 10px;max-width:620px;position:relative;text-align:center;background:var(--pri-soft);border:2px solid var(--gold);border-radius:12px;padding:12px 56px;box-shadow:inset 0 0 0 5px var(--pri-soft),inset 0 0 0 6px var(--gold)}
.cartouche::before,.cartouche::after{content:"";position:absolute;top:10px;bottom:10px;width:36px;background-image:radial-gradient(circle at 50% 50%,var(--gold) 0 2px,transparent 2.5px),radial-gradient(circle at 0 0,transparent 5px,color-mix(in srgb,var(--gold) 30%,transparent) 5.5px 6.5px,transparent 7px);background-size:12px 12px;opacity:.7}
.cartouche::before{left:10px}.cartouche::after{right:10px}
.cartouche .ar{font-family:var(--ar);font-size:clamp(26px,7vw,36px);color:var(--pri);direction:rtl;font-weight:700;line-height:1.5}
.cartouche .en{font-size:13px;color:var(--muted);line-height:1.4}
.cartouche .en b{color:var(--ink);font-size:15px;font-weight:600}
.bism{text-align:center;font-family:var(--q);font-size:calc(var(--qsize) * .95);color:var(--pri);margin:6px 0 14px;direction:rtl;line-height:var(--lhpx);-webkit-text-stroke:var(--qstroke) currentColor}
.an.ip{border:0;border-radius:0;min-width:0;height:auto;margin:0 .08em;padding:0;font-family:var(--q);font-size:1em;vertical-align:baseline;color:var(--gold);line-height:inherit;display:inline}

:root[data-script="indopak"]{--q:"IndoPak Nastaleeq","Amiri Quran","Amiri",serif}
:root[data-script="indopak"] .mushaf{line-height:var(--lhpx)}
.mushaf{direction:rtl;text-align:right;text-align-last:right;font-family:var(--q);font-size:var(--qsize);line-height:var(--lhpx);-webkit-text-stroke:var(--qstroke) currentColor;paint-order:stroke fill;word-spacing:.04em;user-select:text;-webkit-user-select:text}
@media (min-width:600px){.mushaf{text-align:justify;text-align-last:center}}
.w{cursor:pointer;border-radius:6px;transition:background .15s}
.w:hover{background:var(--pri-soft)}
.w.on{background:var(--gold-soft)}
.an{display:inline-flex;align-items:center;justify-content:center;min-width:1.35em;height:1.35em;margin:0 .15em;border:1.5px solid var(--gold);border-radius:50%;font-family:var(--ar);font-size:.5em;color:var(--gold);vertical-align:.25em;cursor:pointer;line-height:1;padding:0 .2em}
.an{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.an.bm{position:relative;z-index:3}
.an.bm::before{content:"";position:absolute;left:50%;bottom:60%;width:calc(var(--qsize)*.66);height:calc(var(--qsize)*1.6);transform:translateX(-50%);
  background:linear-gradient(90deg,color-mix(in srgb,var(--bc,#B32F25) 70%,#000) 0,var(--bc,#B32F25) 22%,color-mix(in srgb,var(--bc,#B32F25) 88%,#fff) 50%,var(--bc,#B32F25) 78%,color-mix(in srgb,var(--bc,#B32F25) 70%,#000) 100%);
  clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%);pointer-events:auto}
.an.bm::after{content:"×";position:absolute;left:50%;bottom:calc(60% + var(--qsize)*.3);transform:translateX(-50%);font:600 calc(var(--qsize)*.5)/1 Literata,Georgia,serif;color:rgba(0,0,0,.38);direction:ltr}
.an.bm.drop::before{animation:ribbon .28s ease-out}
@keyframes ribbon{from{clip-path:polygon(0 0,100% 0,100% 0,50% 0,0 0)}}
@media (prefers-reduced-motion:reduce){.an.bm.drop::before{animation:none}}
.sj{color:var(--teal);font-size:.7em;margin:0 .1em;line-height:0}
.ay.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:var(--gold-soft)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.ay.flash{animation:none;background:var(--gold-soft)}}
.ayblock{border-bottom:1px solid var(--line);padding:12px 2px 16px}
.ayblock .row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ayblock .ref{font-size:13px;color:var(--muted);flex:1}
.ayblock .mushaf{text-align:right;text-align-last:auto}
.translit{font-style:italic;color:var(--teal);font-size:calc(var(--tsize) * .92);margin-top:6px}
.trans{font-size:var(--tsize);margin-top:6px;line-height:1.6}
.ur{direction:rtl;text-align:right;font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif;font-size:calc(var(--tsize) * 1.02);line-height:2.35;margin-top:8px}
.jz{display:flex;align-items:center;gap:12px;color:var(--gold);font-family:var(--lat);font-size:14px;margin:18px 0 6px;direction:ltr}
.jz::before,.jz::after{content:"";flex:1;height:1px;background:color-mix(in srgb,var(--gold) 50%,transparent)}
.mushaf .jz{margin:10px 0;line-height:1.4}
.banner .x{border:0;background:transparent;color:var(--muted);width:44px;height:44px;border-radius:8px;font-size:18px;flex:none}
.banner .x:hover{background:color-mix(in srgb,var(--gold) 20%,transparent)}
#side{display:none}
@media (min-width:1100px){
  #side{display:block;position:fixed;top:calc(52px + env(safe-area-inset-top,0px));bottom:0;left:0;width:280px;overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding:6px 8px 80px}
  body.has-side main,body.has-side .banners{margin-left:280px}
  body.has-side #btnSurahs{display:none}
  body.focus #side{display:none}
  body.focus main,body.focus .banners{margin-left:0}
}
#side .li{padding:7px 6px;border-radius:8px}
#side .li[aria-current="true"]{background:var(--pri-soft)}
#side .li .num{width:28px;height:28px;font-size:12px}
#side .li .arn{font-size:18px}
@media (orientation:landscape) and (max-height:500px){
  header.top{min-height:44px;padding:2px 8px}
  .top .title small{display:none}
  nav.tabs a{flex-direction:row;justify-content:center;gap:6px;padding:6px 0}
  main{padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}
}
/* audit additions */
#prog{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--gold);transition:width .15s linear}
body:not([data-view="read"]) #prog{display:none}
body[data-view="read"] #tt::after{content:"";display:inline-block;width:7px;height:7px;margin-left:7px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:translateY(-3px) rotate(45deg)}
.ameta{float:left;direction:ltr;display:flex;align-items:center;gap:0;font-family:var(--lat);font-size:13px;line-height:1;color:var(--muted);margin:.45em 0 0 -6px}
.ameta .ib{min-width:40px;height:40px;padding:0 6px}
.ameta .ref{padding-left:2px}
.pend{display:flex;align-items:center;gap:12px;color:var(--teal);font-family:var(--lat);font-size:14px;margin:16px 0;direction:ltr;line-height:1.4}
.pend::before,.pend::after{content:"";flex:1;height:0;border-top:1.5px dashed color-mix(in srgb,var(--teal) 55%,transparent)}
.today{max-width:720px}
.tz-cont{padding:10px 0 22px;border-bottom:1px solid var(--line)}
.tz-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:4px}
.tz-sur{font-size:28px;font-weight:600;margin:0;line-height:1.2;color:var(--ink)}
.tz-ref{color:var(--gold);font-weight:400}
.tz-ar{font-family:var(--ar);font-size:32px;color:var(--pri);line-height:1.3;direction:rtl;flex:none}
.tz-sub{margin:0 0 16px;font-size:14px}
.btn.lg{padding:12px 22px;font-size:16px;width:100%}
@media (min-width:600px){.btn.lg{width:auto}}
.tz-sec{padding:20px 0;border-bottom:1px solid var(--line)}

/* ---------- reading log & plan ---------- */
function markRead(g){
  const d=today();
  if(st.rt.d!==d){st.rt={d,ids:[]};}
  if(!st.rt.ids.includes(g)){st.rt.ids.push(g);st.log[d]=st.rt.ids.length;}
  if(st.plan&&g===st.plan.pos){const pi=planInfo();const before=st.plan.pos;advancePlan();
    if(pi&&!pi.finished&&before<pi.dayEnd&&st.plan.pos>=pi.dayEnd)if(st.plan.pos>=TOTAL)toast("Khatam complete. Alhamdulillah.",{label:"Khatmah Dua",fn:()=>{location.hash="#dua";}});else toast("Today’s portion is complete. Alhamdulillah.");}
  dirty=true;
}
function advancePlan(){const p=st.plan;const set=new Set(st.rt.ids);while(p.pos<TOTAL&&set.has(p.pos))p.pos++;}
let dirty=false;setInterval(()=>{if(dirty){dirty=false;save();refreshBanners();}},4000);
function planBounds(p){
  const from=p.from,n=p.days;let sum=0;const w=[];
  for(let g=from;g<TOTAL;g++){const {s,a}=fromG(g);const L=V[s-1][a-1][0].length;w.push(L);sum+=L;}
  const ends=[];let c=0,k=1;
  for(let i=0;i<w.length;i++){c+=w[i];while(k<=n&&c>=sum*k/n-1e-6){ends.push(from+i+1);k++;}}
  while(ends.length<n)ends.push(TOTAL);
  return ends;
}
var boundsCache=null;
function planInfo(){
  const p=st.plan;if(!p)return null;
  if(!boundsCache||boundsCache.key!==p.from+"|"+p.days)boundsCache={key:p.from+"|"+p.days,ends:planBounds(p)};
  const ends=boundsCache.ends;
  const k=Math.max(0,Math.min(p.days-1,dayDiff(p.start,today())));
  const dayStart=k===0?p.from:ends[k-1],dayEnd=ends[k];
  const left=Math.max(0,dayEnd-Math.max(p.pos,dayStart));
  const done=p.pos-p.from,all=TOTAL-p.from;
  const behind=p.pos<dayStart?dayStart-p.pos:0;
  return {k,dayStart,dayEnd,left,done,all,behind,finished:p.pos>=TOTAL};
}
function streak(){
  let n=0;const d=new Date();
  const key=x=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
  if((st.log[key(d)]||0)<st.goal)d.setDate(d.getDate()-1);
  while((st.log[key(d)]||0)>=st.goal){n++;d.setDate(d.getDate()-1);}
  return n;
}

  }

    const pi=planInfo();const readT=st.log[d]||0;

      out.push('<div class="banner"><span class="grow"><b>Today’s khatam portion:</b> '+pi.left+' ayahs left.</span><button class="btn small" data-plan="1">Continue</button>'+X("rem")+'</div>');

    }

  const sig=out.join("")+(!(view==="read"||view==="today")||document.body.classList.contains("focus"));const changed=B.dataset.sig!==sig;B.dataset.sig=sig;

  B.innerHTML=out.join("");if(an)requestAnimationFrame(()=>relayout(an));B.classList.toggle("hidden",!out.length||!(view==="read"||view==="today")||document.body.classList.contains("focus"));

function loadCur(){
  const el=audioEl();el.src=PL.bism?recURL(1,1):recURL(PL.s,PL.a);el.playbackRate=+st.settings.rate||1;
  setPS("loading");el.play().catch(e=>{if(e&&e.name==="NotAllowedError")setPS("paused");else if(!(e&&e.name==="AbortError"))setPS("error");});

  if(PL.bism){PL.bism=false;return loadCur();}

    if(view==="read"&&cur.s===was&&st.settings.follow)openAt(PL.s,1);return loadCur();}

/* ---------- search ---------- */
const HAR=/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640\u034F\u0898-\u089F\u08D3-\u08FF\u200C\u200D]/g;
const normAr=t=>t.replace(HAR,"").replace(/[ٱأإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/[یى]/g,"ي").replace(/ک/g,"ك").replace(/ہ/g,"ه");

function buildIdx(){if(IDX)return;IDX=[];for(let s=1;s<=114;s++)V[s-1].forEach((v,i)=>{const n=normAr(v[0]);IDX.push([s,i+1,n,n.replace(/ا/g,""),v[1].toLowerCase(),v[2].toLowerCase(),normAr(v[5]||"")]);});}
const simp=t=>t.toLowerCase().replace(/[^a-z0-9]/g,"");
$("#btnSearch").onclick=()=>{
  sheet('<input type="search" id="q" placeholder="Surah, 2:255, Arabic or English word" style="width:100%" autocomplete="off"><div id="sr" class="sres" style="margin-top:10px"><p class="muted">Try “Kahf”, “18:10”, “رحمة” or “patience”.</p></div>',
   sh=>{const q=sh.querySelector("#q");q.focus();let t;q.oninput=()=>{clearTimeout(t);t=setTimeout(()=>doSearch(q.value,sh.querySelector("#sr")),220);};});
};
async function doSearch(q,out){
  q=q.trim();if(!q){out.innerHTML="";return;}
  if(!MEAN.every(p=>loaded[p])){out.innerHTML='<p class="muted">Loading…</p>';try{await needMeanings();}catch(e){out.innerHTML='<p class="muted">Search needs the meanings, which couldn’t load. Check your connection.</p>';return;}}
  let h="";
  const m=q.match(/^(\d{1,3})\s*[:.\s]\s*(\d{1,3})$/);
  if(m){const s=+m[1],a=+m[2];if(s>=1&&s<=114&&a>=1&&a<=V[s-1].length){const v=V[s-1][a-1];h+='<ul class="list"><li><button class="li" data-go="'+s+':'+a+'"><span class="mid"><b>'+esc(sname(s))+' '+s+':'+a+'</b><div class="ar">'+esc(v[0])+'</div><small>'+esc(v[1])+'</small></span></button></li></ul>';}}
  const sq=simp(q),nq=normAr(q);
  const sm=S.map((x,i)=>[x,i+1]).filter(([x,n])=>(sq&&(simp(x[1]).includes(sq)||simp(x[2]).includes(sq)||String(n)===q))||(nq&&/[\u0600-\u06FF]/.test(q)&&normAr(x[0]).includes(nq)));
  if(sm.length)h+='<h2 style="margin-top:6px">Surahs</h2><ul class="list">'+sm.slice(0,12).map(([x,n])=>'<li><button class="li" data-go="'+n+':1"><span class="num"><span>'+n+'</span></span><span class="mid"><b>'+esc(x[1])+'</b><small>'+esc(x[2])+'</small></span><span class="arn">'+esc(x[0])+'</span></button></li>').join("")+'</ul>';
  if(q.length>=2&&!m){
    buildIdx();const isAr=/[\u0600-\u06FF]/.test(q);const lq=q.toLowerCase();const nq2=nq.replace(/ا/g,"");
    const res=[];for(const r of IDX){if(isAr?(r[2].includes(nq)||r[3].includes(nq2)||(tl()!=="en"&&r[6].includes(nq))):(r[4].includes(lq)||r[5].includes(lq))){res.push(r);if(res.length>=120)break;}}
    if(res.length){h+='<h2 style="margin-top:10px">Ayahs ('+(res.length>=120?"120+":res.length)+')</h2><ul class="list">'+res.map(r=>{const v=V[r[0]-1][r[1]-1];
      const tr=isAr?esc(v[1]):esc(v[1]).replace(new RegExp(lq.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),x=>"<mark>"+x+"</mark>");
      return '<li><button class="li" data-go="'+r[0]+':'+r[1]+'"><span class="mid"><b>'+esc(sname(r[0]))+' '+r[0]+':'+r[1]+'</b>'+(isAr?'<div class="ar">'+esc(v[0])+'</div>':'')+'<small>'+tr+'</small></span></button></li>';}).join("")+'</ul>';}
  }
  out.innerHTML=h||'<p class="muted">No matches. Check the spelling, or try fewer letters.</p>';
}

/* ---------- today view ---------- */
const DAILY=["2:255","2:286","2:152","2:153","2:186","3:139","3:173","94:5","65:3","13:28","39:53","2:45","21:87","17:23","17:24","31:13","31:17","31:18","49:13","49:12","5:32","16:90","16:97","20:114","25:63","3:190","3:191","55:13","112:1","1:5","2:201","7:23","12:86","12:87","18:10","18:46","19:4","28:24","21:83","14:7","8:46","3:159","29:69","33:41","40:60","41:34","57:20","59:18","64:16","67:2","93:5","103:2","99:7","2:155","2:156","11:88","20:25","20:26","3:8","27:19"];
function dailyRef(){const n=Math.floor(new Date(today()+"T12:00:00").getTime()/864e5);const [s,a]=DAILY[((n%DAILY.length)+DAILY.length)%DAILY.length].split(":").map(Number);return {s,a};}
function patSVG(){return '<svg viewBox="0 0 120 120" width="100%" height="100%" preserveAspectRatio="xMidYMid slice"><defs><pattern id="st8" width="40" height="40" patternUnits="userSpaceOnUse"><g fill="none" stroke="#D9B35E" stroke-width="1"><rect x="10" y="10" width="20" height="20"/><rect x="10" y="10" width="20" height="20" transform="rotate(45 20 20)"/><circle cx="20" cy="20" r="4"/></g></pattern></defs><rect width="120" height="120" fill="url(#st8)"/></svg>';}
const dkey=x=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
function renderToday(){
  const d=today();const readT=st.log[d]||0;const pct=Math.min(100,Math.round(readT/st.goal*100));
  const pi=planInfo();const dr=dailyRef();const dv=V[dr.s-1][dr.a-1];
  const L=st.last,info=S[L.s-1],sp=Math.round(L.a/info[4]*100),fresh=L.s===1&&L.a===1&&!Object.keys(st.log).length;
  let h='<div class="view today">';
  h+='<section class="tz-cont" aria-labelledby="tzc"><div class="tz-row"><div><h1 class="tz-sur" id="tzc">'+esc(info[1])+' <span class="tz-ref">'+L.s+':'+L.a+'</span></h1></div><div class="tz-ar" aria-hidden="true">'+esc(info[0])+'</div></div>'
    +'<p class="muted tz-sub">'+(fresh?'Start from the beginning, or pick any surah from the list.':'Where you stopped · Juz '+juzOf(G(L.s,L.a))+' · '+sp+'% of the surah')+'</p>'
    +'<button class="btn lg" data-cont="1">'+(fresh?'Start reading':'Continue reading')+'</button></section>';
  // goal
  const met=readT>=st.goal;let week='';
  for(let i=6;i>=0;i--){const dd=new Date();dd.setDate(dd.getDate()-i);const v=st.log[dkey(dd)]||0;const cls=v>=st.goal?"on":v>0?"part":"";
    week+='<li class="'+(i===0?"now":"")+'" aria-label="'+dd.toLocaleDateString(undefined,{weekday:"long"})+': '+v+' ayahs"><span class="dot '+cls+'"></span><small aria-hidden="true">'+dd.toLocaleDateString(undefined,{weekday:"narrow"})+'</small></li>';}
  const sk=streak();
  h+='<section class="tz-sec" aria-labelledby="tzg"><div class="tz-head"><h2 id="tzg">Daily goal</h2><button class="link" id="editGoal">Change goal</button></div>'
    +'<div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="'+st.goal+'" aria-valuenow="'+Math.min(readT,st.goal)+'" aria-label="Ayahs read today"><i style="width:'+pct+'%"></i></div>'
    +'<p class="tz-line"><b>'+readT+'</b> of '+st.goal+' ayahs today'+(met?' · goal reached':'')+(sk?' · '+sk+'-day streak':'')+'</p>'
    +'<ol class="week">'+week+'</ol></section>';
  // khatam
  h+='<section class="tz-sec" aria-labelledby="tzk"><div class="tz-head"><h2 id="tzk">Khatam plan</h2>'+(pi?'<button class="link" id="newPlan">'+(pi.finished?"Start a new khatam":"Change plan")+'</button>':'')+'</div>';
  if(pi){const p=st.plan;const pc=Math.round(pi.done/pi.all*100);const dsp=fromG(Math.min(TOTAL-1,Math.max(p.pos,pi.dayStart)));const dep=fromG(pi.dayEnd-1);
    const endD=new Date(new Date(p.start+"T12:00:00").getTime()+(p.days-1)*864e5).toLocaleDateString(undefined,{day:"numeric",month:"short"});
    if(pi.finished)h+='<p class="tz-line" style="margin-top:8px"><b>Khatam complete.</b> Alhamdulillah.</p><div class="tz-acts"><a class="btn" href="#dua" lang="ar">دعاء ختم القرآن الكريم</a></div>';
    else{
      h+='<div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pc+'" aria-label="Khatam progress"><i style="width:'+pc+'%"></i></div>'
       +'<p class="tz-line">Day '+(pi.k+1)+' of '+p.days+' · <b>'+pc+'%</b> read · finish by '+endD+'</p>'
       +'<p class="tz-line muted" style="margin-top:4px">'+(pi.left?'Today: '+esc(sname(dsp.s))+' '+dsp.s+':'+dsp.a+' to '+esc(sname(dep.s))+' '+dep.s+':'+dep.a+' · '+pi.left+' ayahs left':'Today’s portion is done.')+(pi.behind?' · <span style="color:var(--danger)">'+pi.behind+' ayahs behind</span>':'')+'</p>'
       +(pi.left?'<div class="tz-acts"><button class="btn" data-plan="1">Read today’s portion</button></div>':'');
    }
  }else h+='<p class="tz-line muted" style="margin-top:6px">Finish the whole Quran in the number of days you choose. Each day gets an equal portion, and the reader marks where it ends.</p><div class="tz-acts"><button class="btn ghost" id="newPlan">Set up a plan</button></div>';
  h+='</section>';
  // ayah of the day
  h+='<section class="tz-sec" aria-labelledby="tzd"><h2 id="tzd">Ayah of the day</h2><div class="daily"><span class="pat" aria-hidden="true">'+patSVG()+'</span><span class="ref">'+esc(sname(dr.s))+' '+dr.s+':'+dr.a+'</span><div class="ar" lang="ar">'+esc(dv[0])+'</div>'
    +'<div class="dact"><button class="play" id="dailyBtn"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M7 5l12 7-12 7z" fill="currentColor"/></svg>Watch the 1-minute story</button><button class="ghost-l" id="dailyPdf">Save as PDF</button><button class="ghost-l" data-go="'+dr.s+':'+dr.a+'">Read in context</button></div></div></section>';
  h+='</div>';
  $("#main").innerHTML=h;
  $("#dailyBtn").onclick=()=>playStory(dr.s,dr.a);
  $("#dailyPdf").onclick=()=>storyPDF(dr.s,dr.a);
  $("#editGoal").onclick=goalSheet;
  $("#newPlan").onclick=planSheet;
}
function goalSheet(){
  sheet('<h2>Daily goal</h2><p class="muted" style="margin-top:0">How many ayahs do you want to read each day?</p><div class="chips" id="gch">'+[5,10,20,50,100].map(n=>'<button class="chip" aria-pressed="'+(st.goal===n)+'" data-goal="'+n+'">'+n+'</button>').join("")+'</div>'
   +'<div class="field"><label for="gc">Or enter a number</label><input type="number" id="gc" min="1" max="6236" inputmode="numeric" value="'+st.goal+'" style="width:110px"></div>'
   +(st.plan?'<p class="muted" style="font-size:13px">Your khatam plan needs about '+Math.ceil((TOTAL-st.plan.from)/st.plan.days)+' ayahs a day.</p>':'')
   +'<p id="gerr" class="muted" role="alert" style="color:var(--danger);min-height:1.2em;margin:4px 0"></p><button class="btn" id="gs" style="width:100%">Save goal</button>',
   sh=>{const inp=sh.querySelector("#gc");

function planSheet(){
  let days=st.plan?st.plan.days:30,from="start";
  sheet('<h2>Khatam plan</h2><p class="muted" style="margin-top:0">Finish the Quran in</p><div class="chips" id="pd">'+[3,7,10,15,30,40,60,90,365].map(n=>'<button class="chip" aria-pressed="'+(n===days)+'" data-d="'+n+'">'+n+' days</button>').join("")+'</div>'
   +'<div class="field"><label for="pdn">Or any number of days</label><input type="number" id="pdn" min="1" max="3650" value="'+days+'" style="width:100px"></div>'
   +'<div class="seg"><button data-f="start" aria-pressed="true">From Al-Fatihah</button><button data-f="here" aria-pressed="false">From '+esc(sname(st.last.s))+' '+st.last.s+':'+st.last.a+'</button></div>'
   +'<p id="pest" class="muted"></p><button class="btn" id="ps" style="width:100%">Start plan</button>'+(st.plan?'<button class="btn ghost" id="pdel" style="width:100%;margin-top:8px">Remove plan</button>':''),

const expP={};
function getExplanation(s,a){
  const ck="qr-story2-"+s+":"+a;
  if(expP[ck])return expP[ck];
  return expP[ck]=(async()=>{
    try{const c=JSON.parse(localStorage.getItem(ck)||"null");if(c&&c.length)return c;}catch(e){}
    try{const sample=window.claude&&claude.use?await claude.use("sample"):null;
      if(!sample&&!(CFG&&CFG.ai))return null;
      const v=V[s-1][a-1];
      const prompt="You are helping a Muslim reader understand one ayah of the Quran. Ayah "+s+":"+a+" (Surah "+sname(s)+").\nArabic: "+v[0]+"\nTranslation (Saheeh International): "+v[1]+"\n\nWrite a short explanation in 3 or 4 scenes for a one-minute story video, based on well-known mainstream tafsir (such as Ibn Kathir, al-Tabari, al-Sa'di). Scenes: (1) context or the story behind it, including the prophet or people involved if any, (2) what it means, (3) a practical lesson for today, optionally (4) a closing reflection. Each scene at most 45 words, simple English, respectful, no rulings or fatwas, no invented hadith; if the context is not well known, say so plainly instead of guessing. Also give each scene in natural, simple Urdu as a Pakistani scholar would write it (Urdu script, not transliteration; use اللہ, نبی ﷺ and respectful phrasing), with the same meaning as the English. Respond with JSON only: {\"scenes\":[{\"title\":\"...\",\"text\":\"...\",\"title_ur\":\"...\",\"text_ur\":\"...\"}]}";
      let r=null;
      if(sample)r=await sample.json(prompt,{modelTier:"default"});
      else{const res=await fetch("/api/explain",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({s,a,surah:sname(s),arabic:V[s-1][a-1][0],translation:V[s-1][a-1][1]})});if(res.ok)r=await res.json();}
      if(r&&Array.isArray(r.scenes)){const ex=r.scenes.slice(0,4).map(x=>({k:String(x.title||""),t:String(x.text||""),ku:String(x.title_ur||""),tu:String(x.text_ur||"")})).filter(x=>x.t);if(ex.length){try{localStorage.setItem(ck,JSON.stringify(ex));}catch(e){}return ex;}}
    }catch(e){}
    delete expP[ck];return null;
  })();
}

      setT('24px "Noto Nastaliq Urdu", serif',muted,"center",true);ctx.fillText("اردو ترجمہ · فتح محمد جالندھری",W/2,y+4);y+=58;for(const l of ul){ensure(84);setT('34px "Noto Nastaliq Urdu", serif',ink,"center",true);ctx.fillText(l,W/2,y+16);y+=84;}}

let storyTimer=null,storyState=null,storyAu=null;
function closeStory(){return closeOverlay();}
async function playStory(s,a){
  try{await needMeanings();}catch(e){return;}
  if(overlayOpen())await closeOverlay();
  const v=V[s-1][a-1];const ref=sname(s)+" "+s+":"+a;
  const scenes=[{k:ref,ar:v[0]},{k:"How to say it",t:v[2],cls:"it"}];if(tl()!=="ur")scenes.push({k:"Meaning",t:"“"+v[1]+"”"});if(tl()!=="en"&&v[5])scenes.push({k:"اردو ترجمہ",t:v[5],ur:1});
  const el=document.createElement("div");el.className="story";el.setAttribute("role","dialog");el.setAttribute("aria-label","Ayah of the day story");
  el.innerHTML='<div class="bars" id="bars"></div><div class="stop"><span>'+esc(ref)+'</span><span><button id="spdf">PDF</button><button id="snar" aria-pressed="false">Narrate</button><button id="spause">Pause</button><button id="sclose" aria-label="Close">✕</button></span></div><div class="stage"><div class="pat">'+patSVG()+'</div><button class="tapl" aria-label="Previous"></button><button class="tapr" aria-label="Next"></button><div id="scene"></div></div><div class="foot" id="sfoot"></div>';
  document.body.appendChild(el);pushOv();
  const tafLink='<a href="'+tafsirURL(s,a,"en-tafisr-ibn-kathir")+'" target="_blank" rel="noopener" style="color:#D9B35E">Read the tafsir (Ibn Kathir) on Quran.com</a>';
  el.querySelector("#sfoot").innerHTML=(st.settings.aiExp?"Loading the explanation… · ":"")+"Translations: Saheeh International"+(tl()!=="en"?", Fateh Muhammad Jalandhari":"")+" · "+tafLink;
  storyState={i:0,t:0,paused:false,narr:false,scenes};
  el.querySelector("#sclose").onclick=closeStory;
  el.querySelector("#spdf").onclick=()=>{storyState.paused=true;el.querySelector("#spause").textContent="Play";speechSynthesis.cancel();if(storyAu)storyAu.pause();storyPDF(s,a);};
  el.querySelector("#spause").onclick=e=>{storyState.paused=!storyState.paused;e.target.textContent=storyState.paused?"Play":"Pause";if(storyState.paused){speechSynthesis.cancel();if(storyAu)storyAu.pause();}};
  el.querySelector("#snar").onclick=e=>{storyState.narr=!storyState.narr;e.target.setAttribute("aria-pressed",storyState.narr);e.target.textContent=storyState.narr?"Narration on":"Narrate";if(storyState.narr)narrate();else{speechSynthesis.cancel();if(storyAu)storyAu.pause();}};
  el.querySelector(".tapl").onclick=()=>go(-1);el.querySelector(".tapr").onclick=()=>go(1);
  const drawBars=()=>{el.querySelector("#bars").innerHTML=storyState.scenes.map(()=> '<i><b></b></i>').join("");};
  function drawScene(){const sc=storyState.scenes[storyState.i];
    el.querySelector("#scene").innerHTML='<div class="scene"><div class="kicker">'+esc(sc.k)+'</div>'+(sc.ar?'<div class="sar">'+esc(sc.ar)+'</div>':'<div class="stx"'+(sc.cls?' style="font-style:italic"':sc.ur?' style="direction:rtl;font-family:&quot;Noto Nastaliq Urdu&quot;,serif;line-height:2.3"':'')+'>'+esc(sc.t)+'</div>')+'</div>';
    el.querySelectorAll("#bars b").forEach((b,j)=>b.style.width=j<storyState.i?"100%":"0");if(storyState.narr)narrate();}
  function narrate(){const sc=storyState.scenes[storyState.i];if(storyAu)storyAu.pause();
    if(sc.ar&&AUDIO){try{speechSynthesis.cancel();}catch(e){}if(!storyAu)storyAu=new Audio();storyAu.src=recURL(s,a);storyAu.play().catch(()=>{});return;}
    if(sc.ar)speak(sc.ar,"ar-SA",0.75);else if(sc.cls)speechSynthesis.cancel();else if(sc.ur)speak(sc.t,"ur-PK",0.9);else speak(sc.t.replace(/[“”]/g,""),"en-US",0.95);}

  drawBars();drawScene();
  storyTimer=setInterval(()=>{if(!storyState||storyState.paused)return;storyState.t+=100;const sc=storyState.scenes[storyState.i];const p=Math.min(100,storyState.t/dur(sc)*100);const b=el.querySelectorAll("#bars b")[storyState.i];if(b)b.style.width=p+"%";if(storyState.t>=dur(sc))go(1);},100);
  if(!st.settings.aiExp)return;

  else foot.innerHTML="The AI explanation isn’t available right now. · "+tafLink;

    toast("Bookmark removed",{label:"Undo",fn:()=>{st.bookmarks.splice(i,0,rm);save();if(view==="bookmarks")renderBookmarks();}});});
}


/* ---------- more ---------- */
function renderMore(){
  const ic=p=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+p+'</svg>';
  const row=(attr,svg,title,sub)=>'<li><button class="li" '+attr+'>'+ic(svg)+'<span class="mid"><b>'+title+'</b>'+(sub?'<small>'+sub+'</small>':'')+'</span></button></li>';
  let h='<div class="view today more"><ul class="list">';
  h+=row('id="mSet"','<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>','Settings','Text size, script, meanings'+(AUDIO?', recitation':'')+', theme, reminders');
  h+=row('id="mSigns"','<circle cx="12" cy="12" r="8"/><path d="M12 11v5M12 8h.01"/>','Signs in the Quran','Stop signs and reading marks explained');
  if(CFG&&!isStandalone())h+=row('id="mInst"','<path d="M12 4v11M7 10l5 5 5-5M5 19h14"/>','Add to your home screen','Opens like an app and works offline');
  if(CFG&&navigator.share)h+=row('id="mShare"','<path d="M12 4v11M7 9l5-5 5 5M5 14v5h14v-5"/>','Share this app','Send the link to family and friends');
  h+=row('id="mDua"','<path d="M12 3l2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 15.4 7.2 17.9l.9-5.4-3.9-3.8 5.4-.8z"/>','دعاء ختم القرآن الكريم','Khatmah Dua · supplication on completing the Quran');
  h+=row('id="mAbout"','<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/>','Sources and credits','Where the Quran text, translations and audio come from');
  h+='</ul></div>';
  $("#main").innerHTML=h;
  $("#mSet").onclick=openSettings;
  $("#mSigns").onclick=()=>{location.hash="#guide";};
  $("#mAbout").onclick=()=>{location.hash="#about";};
  $("#mDua").onclick=()=>{location.hash="#dua";};
  const mi=$("#mInst");if(mi)mi.onclick=installSheet;
  const ms=$("#mShare");if(ms)ms.onclick=()=>navigator.share({title:"Yours Quran Reader",text:"A Quran reader with IndoPak script, bookmarks, recitation and a khatam planner.",url:location.origin+"/"}).catch(()=>{});
}
function installSheet(){
  let body;
  if(bip)body='<p>Install Yours Quran Reader on this device. It gets its own icon, opens full screen, and the Quran text works without internet.</p><button class="btn" id="doInst" style="width:100%">Install</button>';
  else if(isIOS())body='<ol class="prose" style="padding-left:20px;line-height:1.7"><li>Open this page in <b>Safari</b>.</li><li>Tap the <b>Share</b> button (the square with an arrow).</li><li>Scroll down and tap <b>Add to Home Screen</b>, then <b>Add</b>.</li></ol>';
  else body='<ol class="prose" style="padding-left:20px;line-height:1.7"><li>Open this page in <b>Chrome</b>.</li><li>Tap the <b>⋮</b> menu.</li><li>Tap <b>Add to Home screen</b> or <b>Install app</b>.</li></ol>';
  sheet('<h2>Add to your home screen</h2>'+body+'<p class="muted" style="font-size:13px">After the first visit the Quran text, translations and word meanings work offline. Recitation needs an internet connection.</p>',
    sh=>{const b=sh.querySelector("#doInst");if(b)b.onclick=async()=>{bip.prompt();try{await bip.userChoice;}catch(e){}bip=null;closeSheet();};},"Install");
}
function renderAbout(){
  $("#main").innerHTML='<div class="view today prose">'
   +'<p>The Arabic text is shown exactly as published by the sources below, with every diacritic and stop sign kept. Translations are translations of the meaning and are always labelled as such. This app adds no commentary of its own to the Quran.</p>'
   +'<h2>Quran text</h2><p><b>IndoPak script:</b> DigitalKhatt IndoPak text and font by Amine Anane, published by QUL (Tarteel).<br><b>Madani (Uthmani) script:</b> The Noble Qur’an Encyclopedia (quranenc.com).</p>'
   +'<h2>Translations</h2><p><b>English:</b> Saheeh International.<br><b>Urdu:</b> Fateh Muhammad Jalandhari (public domain), digitised by the JustQuran project and checked against the printed edition.<br><b>Transliteration:</b> Tanzil Project.</p>'
   +'<h2>Word by word</h2><p>Word meanings, word pronunciation and word audio come from Quran.com. They are shown only where the words line up exactly with this text; for 5 ayahs they don’t, and only the ayah meaning is shown there.</p>'
   +'<h2>Structure</h2><p>Juz, page (604-page Madani mushaf), ruku, hizb and sajdah positions: the quran-meta project (Hafs). Juz boundaries and sajdah ayahs were cross-checked against a second source.</p>'
   +(AUDIO?'<h2>Recitation</h2><p>Ayah-by-ayah recitation from EveryAyah.com. Recitation needs an internet connection.</p>':'')
   +'<h2>Tafsir</h2><p>Tafsir links open Quran.com (Tafsir Ibn Kathir, abridged; Ma’ariful Qur’an). The optional AI explanation in the daily story is off by default and is not tafsir.</p>'
   +'<h2>Your data</h2><p>Bookmarks, notes, progress and settings are saved on this device only. Nothing is uploaded'+(CFG?'':' outside Claude')+'.</p>'
   +'</div>';
}


/* ---------- Khatmah Dua ---------- */
// Quranic supplications are taken from the app's own Quran text (same source and script as the reader).
const DUA_AYAHS=[[2,286],[3,8],[3,193],[3,194],[14,40],[14,41]];
function renderDua(){
  const ipS=st.settings.script!=="uthmani";
  const qv=([s,a])=>{const v=V[s-1][a-1];return '<div class="card"><div class="qv" lang="ar">'+esc(v[0])+' '+(ipS?'<span class="an ip">۝'+AD(a)+esc(v[4]||"")+'</span>':'<span>﴿'+AD(a)+'﴾</span>')+'</div>'
    +'<p class="src"><span class="tag">Quran</span> '+esc(sname(s))+' '+s+':'+a+'</p></div>';};
  $("#main").innerHTML='<div class="view today dua">'
   +'<h1 lang="ar">دعاء ختم القرآن الكريم</h1><p class="sub">Supplication on completing the Quran</p>'
   +'<p class="src" style="font-size:14px">There is no single wording that must be said when the Quran is completed. You may supplicate in your own words, for yourself, your family and all Muslims. Below are supplications from the Quran itself, one from the Sunnah about the Quran, and the supplication traditionally printed at the end of many mushafs — each labelled with its source.</p>'
   +'<h2>From the Quran</h2>'+DUA_AYAHS.map(qv).join("")
   +'<h2>From the Sunnah</h2><div class="card"><div class="hd" lang="ar">اللَّهُمَّ إِنِّي عَبْدُكَ، ابْنُ عَبْدِكَ، ابْنُ أَمَتِكَ، نَاصِيَتِي بِيَدِكَ، مَاضٍ فِيَّ حُكْمُكَ، عَدْلٌ فِيَّ قَضَاؤُكَ، أَسْأَلُكَ بِكُلِّ اسْمٍ هُوَ لَكَ، سَمَّيْتَ بِهِ نَفْسَكَ، أَوْ عَلَّمْتَهُ أَحَدًا مِنْ خَلْقِكَ، أَوْ أَنْزَلْتَهُ فِي كِتَابِكَ، أَوِ اسْتَأْثَرْتَ بِهِ فِي عِلْمِ الْغَيْبِ عِنْدَكَ، أَنْ تَجْعَلَ الْقُرْآنَ رَبِيعَ قَلْبِي، وَنُورَ صَدْرِي، وَجِلَاءَ حُزْنِي، وَذَهَابَ هَمِّي</div>'
   +'<p class="src"><span class="tag">Hadith</span> From ʿAbdullāh ibn Masʿūd, reported by Aḥmad (3712) and Ibn Ḥibbān (972). Graded ṣaḥīḥ by al-Albānī (al-Silsilah al-Ṣaḥīḥah 199); some scholars, such as Shuʿayb al-Arnaʾūṭ, considered its chain weak. The Prophet ﷺ taught it for times of worry and grief. It is not specific to completing the Quran, but its request — that the Quran be the spring of one’s heart — makes it fitting.</p></div>'
   +'<h2>Traditional supplication</h2><div class="card"><div class="hd" lang="ar">اللَّهُمَّ ارْحَمْنِي بِالْقُرْآنِ، وَاجْعَلْهُ لِي إِمَامًا وَهُدًى وَرَحْمَةً، اللَّهُمَّ ذَكِّرْنِي مِنْهُ مَا نَسِيتُ، وَعَلِّمْنِي مِنْهُ مَا جَهِلْتُ، وَارْزُقْنِي تِلَاوَتَهُ آنَاءَ اللَّيْلِ وَأَطْرَافَ النَّهَارِ، وَاجْعَلْهُ لِي حُجَّةً يَا رَبَّ الْعَالَمِينَ</div>'
   +'<p class="src"><span class="tag">Traditional</span> Widely printed at the end of mushafs, often with small differences in wording. It is <b>not</b> authentically established as the words of the Prophet ﷺ: the report has a broken chain (graded muʿḍal by al-ʿIrāqī, Takhrīj al-Iḥyāʾ 1/369). It may be read as a general supplication, without attributing it to him.</p></div>'
   +'</div>';
}

/* ---------- signs guide ---------- */
function renderGuide(){
  const IPW=[["ۘ","Waqf lāzim (م)","Stop here. Joining could change the meaning."],["ؕ","Waqf muṭlaq (ط)","Stopping is preferred."],["ۚ","Waqf jāʾiz (ج)","You may stop or continue. Stopping is slightly better."],["ؗ","Waqf mujawwaz (ز)","You may stop, but continuing is better."],["ࣕ","Waqf murakhkhaṣ (ص)","Continue if you can. You may stop if out of breath."],["ۖ","Al-waṣl awlā (صلے)","Continuing is better than stopping."],["ࣗ","Qīla ʿalayhil-waqf (ق)","Some scholars stop here. Continuing is better."],["ۙ","Lā (لا)","Don’t stop in the middle of an ayah. Above an ayah marker, stopping is allowed."],["ࣞ","Qif (قف)","Stop here."],["ۛ","Muʿānaqah (three dots)","Comes in pairs. Stop at one of them, not both."],["ࣝ","Saktah (سکتہ)","Pause briefly without taking a breath."],["ࣟ","Waqfah (وقفہ)","Pause a little longer than saktah, without taking a breath."],["ࣖ","Rukūʿ (ع)","End of a section. The Quran has 558 rukūʿ, often used for daily portions or in tarawih."],["ࣛ","Sajdah (السجدة)","An ayah of prostration. Prostrate after reciting or hearing it."]];
  const IPR=[["ۡ","Jazm","The letter has no vowel."],["ٰ","Khaṛā zabar","Read a long ā, two counts."],["ٖ","Khaṛī zer","Read a long ī, two counts."],["ٗ","Ulṭā pesh","Read a long ū, two counts."],["࢜","Madd wājib","Lengthen four to five counts. This is required."],["ٓ","Madd","Lengthen the sound."],["ۢ","Small mīm","Read the nūn as mīm (iqlāb)."]];
  const MW=[["ۘ","Waqf lāzim (small mīm)","Stop here."],["ۗ","Qalā","Stopping is better."],["ۚ","Jāʾiz (small jīm)","Stopping or continuing are equal."],["ۖ","Ṣalā","Continuing is better."],["ۙ","Lā","Don’t stop here."],["ۛ","Muʿānaqah","Stop at one of the pair, not both."],["ۜ","Saktah (small sīn)","Brief pause without breath."],["۞","Rubʿ al-ḥizb","Start of a quarter ḥizb."],["۩","Sajdah","Ayah of prostration."]];
  const ex=(ch,idx)=>{for(const sv of V)for(const v of sv){const tx=v[idx]||"";if(tx.includes(ch)){const w=tx.split(" ").find(w=>w.includes(ch));if(w)return w;}}return null;};
  const blk=(a,cls,idx)=>a.map(x=>{const w=ex(x[0],idx);return '<div class="sign"><div class="g '+cls+(w?" word":"")+'" aria-hidden="true">'+esc(w||x[0])+'</div><div><b>'+x[1]+'</b><p>'+x[2]+'</p></div></div>';}).join("");
  const ipFirst=st.settings.script!=="uthmani";
  const ip='<h2 style="margin-top:18px">Stop signs in the IndoPak script</h2><div class="signs">'+blk(IPW,"ipf",3)+'</div><h2 style="margin-top:22px">Reading marks in the IndoPak script</h2><div class="signs">'+blk(IPR,"ipf",3)+'</div>';
  const md='<h2 style="margin-top:22px">Signs in the Madani script</h2><div class="signs">'+blk(MW,"mdf",6)+'</div>';
  $("#main").innerHTML='<div class="view"><p class="muted" style="margin-top:4px">What the small marks above and between the words mean, shown exactly as they appear in this app.</p>'
   +(ipFirst?ip+md:md+ip)
   +'<p class="muted" style="font-size:13px;margin-top:18px">Rules can differ slightly between printings. Learn the details from a qualified teacher.</p><p class="muted" style="font-size:12px">IndoPak Arabic text and font: DigitalKhatt IndoPak by Amine Anane, QUL / Tarteel Inc. Madani text: quranenc.com. English: Saheeh International. Urdu: Fateh Muhammad Jalandhari.</p></div>';
}

/* desktop surah sidebar */
function buildSide(){const sd=$("#side");if(!sd)return;
  sd.innerHTML='<ul class="list">'+S.map((x,i)=>'<li><button class="li" data-go="'+(i+1)+':1" data-sn="'+(i+1)+'"><span class="num"><span>'+(i+1)+'</span></span><span class="mid"><b>'+esc(x[1])+'</b><small>'+esc(x[2])+'</small></span><span class="arn">'+esc(x[0])+'</span></button></li>').join("")+'</ul>';
  document.body.classList.add("has-side");}
function markSide(){const sd=$("#side");if(!sd)return;sd.querySelectorAll("[data-sn]").forEach(b=>{const on=+b.dataset.sn===cur.s&&view==="read";b.setAttribute("aria-current",on?"true":"false");if(on&&getComputedStyle(sd).display!=="none"){const r=b.getBoundingClientRect(),sr=sd.getBoundingClientRect();if(r.top<sr.top||r.bottom>sr.bottom)b.scrollIntoView({block:"center"});}});}
buildSide();

/* start */
if(!location.hash)history.replaceState(null,"","#read");
setNavH();
route();
renderPlayer();
// Hosted build: fetch the meanings and word data quietly after the Quran is on screen.
// Waits for the offline cache to be ready first, so these files are downloaded only once.
if(CFG){const go=()=>need(...MEAN,"wbw").catch(()=>{});const sw=navigator.serviceWorker;
  if(sw&&(location.protocol==="https:"||location.hostname==="localhost"))Promise.race([sw.ready,new Promise(r=>setTimeout(r,6000))]).then(()=>setTimeout(go,300));
  else (window.requestIdleCallback||(f=>setTimeout(f,1500)))(go);}
setInterval(refreshBanners,60000);
})();
</script>
<script>if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));</script>
